[project]
name = "trumpscraper"
version = "0.1.0"
description = "Monitor Trump's statements for company mentions + sentiment, with daily Telegram reports"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
audio = ["yt-dlp>=2024.1.0", "faster-whisper>=1.0.0"]

[project.scripts]
trumpscraper = "trumpscraper.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trumpscraper*"]
